x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"
services:
  filestash:
    image: ${IMAGE:-machines/filestash:latest}
    container_name: filestash
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - filestash-data:/app/data/state/
    networks:
      - filestash-workspace-network
volumes:
  filestash-data:
    name: filestash-data
networks:
  filestash-workspace-network:
    external: true
